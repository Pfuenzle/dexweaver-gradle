plugins {
    id 'groovy'
    id 'java-gradle-plugin'
    id 'maven-publish'
    id 'com.gradle.plugin-publish' version '0.12.0'
}

group = 'io.pfuenzle.dexweaver'
version = '2.1.3'

ext.mainArtifact = 'dexweaver-gradle'
ext.artifactName = 'DexWeaver-gradle'

repositories {
    jcenter()
    mavenCentral()
    google()
}

dependencies {
    implementation localGroovy()
    compileOnly 'com.android.tools.build:gradle:4.0.0'
}

compileGroovy {
    options.compilerArgs << '-proc:none'
}

apply from: 'configure-artifacts.gradle'

afterEvaluate {
    def archivesArtifacts = configurations.archives.artifacts
    archivesArtifacts.removeAll archivesArtifacts.findAll { it.classifier in ['javadoc', 'groovydoc'] }
}

pluginBundle {

    website = 'https://github.com/Pfuenzle/dexweaver-gradle'
    vcsUrl = 'https://github.com/Pfuenzle/dexweaver-gradle'

    description = 'DexWeaver is a toolchain for modifying Android APK files at source-level using Java, ' +
            'graphical resource editors, and the full power of Android Studio in all major platforms. ' +
            'Fork of the DexPatcher toolchain.'

    tags = ['android', 'application', 'apk', 'dexweaver', 'dexpatcher', 'apktool', 'dex2jar', 'patch', 'modify', 'reverse']

    mavenCoordinates {
        groupId = group
        artifactId = mainArtifact
    }

}

gradlePlugin {

    plugins {

        basePlugin {
            id = 'io.pfuenzle.dexweaver.base'
            implementationClass = 'io.pfuenzle.dexweaver.gradle.plugins.DexpatcherBasePlugin'
            displayName = 'DexWeaver Base'
            description = 'The DexWeaver Base plugin provides basic DexWeaver, Apktool and dex2jar tasks. ' +
                    'DexWeaver is free software. (GPLv3+)'
        }

        apkLibraryPlugin {
            id = 'io.pfuenzle.dexweaver.apk-library'
            implementationClass = 'io.pfuenzle.dexweaver.gradle.plugins.ApkLibraryPlugin'
            displayName = 'DexWeaver APK Library'
            description = 'The DexWeaver APK Library plugin processes a source application provided as an Android APK ' +
                    'and produces a DexWeaver APK library. The library is used to create modified versions of the ' +
                    'source application and includes its Dalvik bytecode and decoded manifest and resources. ' +
                    'DexWeaver is free software. (GPLv3+)'
        }

        patchedAppPlugin {
            id = 'io.pfuenzle.dexweaver.patched-application'
            implementationClass = 'io.pfuenzle.dexweaver.gradle.plugins.PatchedAppPlugin'
            displayName = 'DexWeaver Patched Application'
            description = 'The DexWeaver Patched Application plugin produces a modified Android application by applying ' +
                    'changes to code, manifest and resources of a source application provided as an Android APK or ' +
                    'a DexWeaver APK library. DexWeaver is free software. (GPLv3+)'
        }

        patchLibraryPlugin {
            id = 'io.pfuenzle.dexweaver.patch-library'
            implementationClass = 'io.pfuenzle.dexweaver.gradle.plugins.PatchLibraryPlugin'
            displayName = 'DexWeaver Patch Library'
            description = 'The DexWeaver Patch Library plugin produces a DexWeaver patch library that bundles compiled ' +
                    'changes to code, manifest and resources of a source application without bundling any part of the '  +
                    'application itself. The source application is provided as an Android APK or a DexWeaver APK library. ' +
                    'DexWeaver patch libraries are similar in structure to Android libraries (AAR files). ' +
                    'The changes bundled in a patch library are applied to its source application using the DexWeaver ' +
                    'Patched Application plugin. Several patch libraries can be applied in the same step or their ' +
                    'application can be serialized and chained. DexWeaver is free software. (GPLv3+)'
        }

    }

}
publishing {
    publications {
        dexweaverGradleTool(MavenPublication) {
            artifactId = mainArtifact + '-tool'
            from components.java
            pom {
                name = artifactName
                description = 'DexWeaver Gradle plugin. Fork of the DexPatcher Gradle plugin.'
                url = 'https://github.com/Pfuenzle/dexweaver-gradle'
                licenses {
                    license {
                        name = 'GNU General Public License (version 3 or later)'
                        url = 'https://www.gnu.org/licenses/gpl.txt'
                    }
                }
                developers {
                    developer {
                        name = 'pfuenzle'
                        url = 'https://github.com/Pfuenzle'
                    }
                }
                scm {
                    connection = 'scm:git:git://github.com/Pfuenzle/dexweaver-gradle.git'
                    developerConnection = 'scm:git:ssh://github.com:Pfuenzle/dexweaver-gradle.git'
                    url = 'https://github.com/Pfuenzle/dexweaver-gradle'
                }
            }
        }
    }
}

apply from: 'check-copyright.gradle'

wrapper.distributionType = Wrapper.DistributionType.ALL
